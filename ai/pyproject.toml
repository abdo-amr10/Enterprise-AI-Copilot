[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-copilot-runtime"
version = "0.1.0"
description = "AI runtime for the Enterprise AI Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "faiss-cpu>=1.9,<2",
    "numpy==2.5.2",
    "ollama==0.6.2",
    "requests==2.32.3",
    "sentence-transformers==6.0.0",
    "sqlglot==30.17.0",
    "uvicorn[standard]==0.30.6",
    "XlsxWriter>=3.2,<4",
]

[project.scripts]
enterprise-ai-copilot = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
markers = [
    "integration: marks tests that require real infrastructure or external services",
]
